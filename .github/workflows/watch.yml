name: KTX 취소표 감시

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "테스트 모드 (실제 예약을 하지 않음)"
        type: boolean
        default: true
      run_minutes:
        description: "이번 실행을 몇 분 동안 돌릴지"
        type: string
        default: "5"

concurrency:
  group: ktx-watch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 감시 시작
        env:
          KORAIL_ID: ${{ secrets.KORAIL_ID }}
          KORAIL_PW: ${{ secrets.KORAIL_PW }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEVICE_PROFILE_ID: ${{ secrets.DEVICE_PROFILE_ID }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_PASSWORD: ${{ secrets.CARD_PASSWORD }}
          CARD_VERIFY: ${{ secrets.CARD_VERIFY }}
          CARD_EXPIRE: ${{ secrets.CARD_EXPIRE }}
          CARD_CORPORATE: ${{ secrets.CARD_CORPORATE }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_MINUTES: ${{ inputs.run_minutes || '340' }}
        run: python watch.py
